:root{--crema:#FBF8F1;--ink:#1c1f22;--slate:#111214;--brick:#A87B18;--line:#d9d6d0;--muted:#6b7178}
*{box-sizing:border-box}
body{margin:0;background:var(--crema);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--slate);color:#fff;padding:14px 16px}
header b{font-size:18px}
.wrap{max-width:820px;margin:0 auto;padding:14px}
.doc{background:var(--crema);border:1px solid var(--line);border-radius:8px;padding:0;overflow-x:auto;font-size:13px}
.doc .sheet,.doc>div{box-shadow:none!important;margin:0 auto!important}
@media(max-width:820px){.doc{padding:0}.doc>div{width:100%!important;max-width:100%!important;padding:14px!important}}
.doc table{width:100%;border-collapse:collapse}
.doc th,.doc td{padding:4px 5px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}
.doc th.r,.doc td.r,.doc .n{text-align:right}
.aviso{background:#FBE9E2;border-left:4px solid var(--brick);padding:12px;border-radius:6px;margin:16px 0;font-size:14px;line-height:1.45}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input[type=text],input:not([type]){width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;font-size:16px;background:#fff;-webkit-appearance:none}
input[type=checkbox]{-webkit-appearance:checkbox;appearance:checkbox;width:26px;height:26px;min-width:26px;accent-color:#A87B18}
canvas{width:100%;height:170px;-webkit-user-select:none;user-select:none;background:#fff;border:1px dashed var(--line);border-radius:6px;touch-action:none;display:block}
.row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
button{padding:12px 16px;border-radius:8px;border:0;font-size:15px;font-weight:700;cursor:pointer}
.ok{background:var(--brick);color:#fff}
.sec{background:#fff;border:1px solid var(--line);color:var(--ink)}
.chk{display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-size:14px;line-height:1.4}
.chk{cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px}
.chk input{flex:0 0 26px;margin-top:2px}
.fin{background:#e8f5ec;border:1px solid #8A6A12;color:#14532d;padding:16px;border-radius:8px;font-size:15px;line-height:1.5}
.cargando{padding:30px;text-align:center;color:var(--muted)}
</style>
</head><body>
<header><b id="hMarca">Presupuesto</b><div id="hSub" style="font-size:13px;opacity:.85"></div></header>
<div class="wrap">
  <div id="cargando" class="cargando">Cargando el presupuesto…</div>
  <div id="cont" style="display:none">
    <div class="row" style="margin-bottom:10px"><button class="sec" id="btnPdf" type="button" onclick="descargarPdf()">Descargar el PDF</button></div><div class="doc" id="doc"></div>
    <div class="aviso"><b>Importante — aceptación bajo reserva</b><div id="aviso" style="margin-top:6px"></div></div>
    <div id="firmar"></div><label>Nombre y apellidos de quien firma</label><input id="nom">
    <label>DNI / NIE <span style="color:var(--muted);font-weight:400">(opcional)</span></label><input id="dni">
    <label>Firma con el dedo aquí abajo</label>
    <canvas id="cv"></canvas>
    <div class="row"><button class="sec" type="button" onclick="limpiar()">Borrar firma</button></div>
    <label class="chk" for="acepto"><input type="checkbox" id="acepto"><span style="color:var(--ink)">He leído el presupuesto y lo acepto <b>bajo reserva</b>, sabiendo que la obra no queda contratada hasta que el contratista me confirme la fecha por escrito.</span></label>
    <div id="lopd" style="font-size:12px;color:var(--muted);line-height:1.45;margin-top:14px;border-top:1px solid var(--line);padding-top:10px"></div><div class="row"><button class="ok" id="btn" onclick="enviar()">Firmar y enviar</button><span id="msg" style="font-size:14px;color:var(--muted)"></span></div>
  </div>
  <div id="fin" class="fin" style="display:none"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
var CFG={apiKey:"AIzaSyDsUvYWlJUPa__voQ7oBznCDWb8o6D1m5Q",authDomain:"reformas-ioan.firebaseapp.com",projectId:"reformas-ioan",storageBucket:"reformas-ioan.firebasestorage.app",messagingSenderId:"65105142083",appId:"1:65105142083:web:cfcb082d4406f938c60ff6"};
firebase.initializeApp(CFG);var db=firebase.firestore();
var TOK=new URLSearchParams(location.search).get('t'),DATOS=null;
function pintaFin(f){document.getElementById('cont').style.display='none';document.getElementById('cargando').style.display='none';
var d=document.getElementById('fin');d.style.display='block';
d.innerHTML='<b>Firmado, gracias.</b><br>'+(f.nombreFirma||'')+(f.dni?' · '+f.dni:'')+'<br>'+(f.fechaFirma||'')+'<br><br>Recuerda: esta aceptación es bajo reserva; la obra queda contratada cuando el contratista te confirme la fecha por escrito.';}
if(!TOK){document.getElementById('cargando').textContent='Enlace incompleto. Pide que te lo manden otra vez.';}
else db.collection('firmas').doc(TOK).update({visto:Date.now()}).catch(function(){});
if(TOK)db.collection("firmas").doc(TOK).get().then(function(s){
  if(!s.exists){document.getElementById('cargando').textContent='Este enlace ya no está disponible.';return}
  DATOS=s.data();
  document.getElementById('hMarca').textContent=DATOS.marca||'Presupuesto';
  document.getElementById('hSub').textContent='Presupuesto nº '+(DATOS.num||'')+(DATOS.cliente?' · '+DATOS.cliente:'');
  if(DATOS.firma){pintaFin(DATOS);return}
  if(DATOS.css){var st=document.createElement('style');st.textContent=DATOS.css.replace(/@media print\{[\s\S]*?\}\s*$/,'');document.head.appendChild(st)}var st2=document.createElement('style');st2.textContent="#doc,#doc *{font-family:'TxtAzk',system-ui,sans-serif}h1,h2,h3,.cond,.ptag,.pclaim,.tot .big,.dochead .who,.ptab tr.cap td,.vals div b,.clausula b,.tarifa-cat,#doc b{font-family:'TitAzk','DejaVu Serif Condensed',Georgia,serif!important}";document.head.appendChild(st2);
  document.getElementById('doc').innerHTML=DATOS.html||'';limpiarDoc();
  document.getElementById('aviso').textContent=DATOS.aviso||'';
  document.getElementById('nom').value=DATOS.cliente||'';
  document.getElementById('lopd').innerHTML='<b>Protecci\u00f3n de datos.</b> Quien trata sus datos es '+(DATOS.responsable||DATOS.marca||'el contratista')+
  (DATOS.nif?' (NIF '+DATOS.nif+')':'')+'. Su nombre, tel\u00e9fono, direcci\u00f3n de la obra y su firma se usan solo para preparar y ejecutar esta obra y su facturaci\u00f3n, y se guardan mientras dure la relaci\u00f3n y el tiempo que obliga la ley. No se ceden a nadie salvo obligaci\u00f3n legal; se alojan en servidores de Google en la Uni\u00f3n Europea. Puede pedir ver, corregir o borrar sus datos escribiendo a '+(DATOS.email||'el contratista')+'. Al firmar acepta este tratamiento.';
  document.getElementById('cargando').style.display='none';
  document.getElementById('cont').style.display='block';
  prepararLienzo();
  if(location.hash==='#firmar')setTimeout(function(){var e=document.getElementById('firmar');if(e)e.scrollIntoView({behavior:'smooth'})},300);
}).catch(function(e){document.getElementById('cargando').textContent='No he podido abrir el presupuesto ('+e.message+')';});

var FIRMA_VER='v121';
try{var _u=new URL(location.href);if(!_u.searchParams.get('v')){fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){if(j&&j.v&&j.v!==FIRMA_VER){_u.searchParams.set('v',j.v);location.replace(_u.toString())}}).catch(function(){})}}catch(_){}
document.addEventListener('DOMContentLoaded',function(){var e=document.createElement('div');e.textContent=FIRMA_VER;e.style.cssText='position:fixed;right:6px;bottom:6px;font-size:10px;color:#9aa0a6;z-index:99';document.body.appendChild(e)});
function limpiarDoc(){var d=document.getElementById('doc');if(!d)return;
try{d.querySelectorAll('.sheet').forEach(function(h){h.style.display=''});
var env=d.querySelectorAll('.sheet');for(var k=0;k<env.length;k++){var h=env[k];if(h.querySelector('.sheet')){var hijas=[].slice.call(h.querySelectorAll('.sheet'));hijas.forEach(function(x){h.parentNode.insertBefore(x,h)});h.parentNode.removeChild(h)}}
var vistas={};[].slice.call(d.querySelectorAll('.sheet')).forEach(function(h){var t=(h.id||'')+'|'+(h.textContent||'').replace(/\s+/g,' ').trim().slice(0,300);if(vistas[t]){h.parentNode.removeChild(h);return}vistas[t]=1});
}catch(_){}}
var H2C='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',JSP='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
function carga(u,t){return new Promise(function(ok,ko){if(t())return ok();var e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=ko;document.head.appendChild(e)})}
var _FF='';try{_FF=([].slice.call(document.querySelectorAll('style')).map(function(s){return s.textContent}).join('\n').match(/@font-face\{[^}]*\}/g)||[]).join('\n')}catch(_){}
function _onclone(doc){try{var st=doc.createElement('style');st.textContent=_FF;doc.head.appendChild(st)}catch(_){}try{return doc.fonts&&doc.fonts.ready?doc.fonts.ready:undefined}catch(_){}}
function descargarPdf(){var b=document.getElementById('btnPdf');var ant=b?b.textContent:'';if(b){b.textContent='Preparando el PDF\u2026';b.disabled=true}
var vistas={};var hojas=[].slice.call(document.querySelectorAll('#doc .sheet')).filter(function(h){h.style.display='';if(h.querySelector('.sheet'))return false;if(!(h.offsetWidth>0&&h.offsetHeight>0))return false;var t=(h.id||'')+'|'+(h.textContent||'').replace(/\s+/g,' ').trim().slice(0,300);if(vistas[t])return false;vistas[t]=1;return true});
if(!hojas.length)hojas=[document.getElementById('doc')];
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){return carga(H2C,function(){return !!window.html2canvas})}).then(function(){return carga(JSP,function(){return !!(window.jspdf&&window.jspdf.jsPDF)})}).then(function(){
var doc=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'p'});var i=0;
function paso(){if(i>=hojas.length){var _d=new Date(),_p=function(n){return (n<10?'0':'')+n};var fich='Presupuesto '+(DATOS.num||'')+(DATOS.marca?' - '+DATOS.marca:'')+' ('+_p(_d.getDate())+'-'+_p(_d.getMonth()+1)+' '+_p(_d.getHours())+_p(_d.getMinutes())+').pdf';
var blob=doc.output('blob');var esIOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
var arch=new File([blob],fich,{type:'application/pdf'});
if(navigator.canShare&&navigator.canShare({files:[arch]}))return navigator.share({files:[arch],title:fich}).catch(function(){window.open(URL.createObjectURL(blob),'_blank')});
if(esIOS){window.open(URL.createObjectURL(blob),'_blank');return Promise.resolve()}
var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fich;a.click();return Promise.resolve()}
var capt=function(sc){return html2canvas(hojas[i],{scale:sc,backgroundColor:'#FBF8F1',useCORS:true,windowWidth:794,logging:false,onclone:_onclone}).catch(function(){return{width:0,height:0}})};var okcv=function(c){return c&&c.width>0&&c.height>0};var altoCSS=hojas[i].offsetHeight||1123,tope=Math.min(2,Math.sqrt(1.1e7/(794*altoCSS)),8000/altoCSS);var sc1=Math.max(0.6,Math.min(2,Math.round(tope*100)/100));return capt(sc1).then(function(cv){return okcv(cv)?cv:capt(Math.max(0.6,sc1/2))}).then(function(cv){return okcv(cv)?cv:capt(0.6)}).then(function(cv){if(!okcv(cv)){i++;return null}return cv}).then(function(cv){if(!cv)return paso();
var altoPag=Math.round(cv.width*297/210);var c0=cv.getContext('2d');
var vacia=function(y){try{var d=c0.getImageData(0,y,cv.width,1).data;for(var x=0;x<d.length;x+=16){if(Math.abs(d[x]-250)>6||Math.abs(d[x+1]-246)>6||Math.abs(d[x+2]-236)>6)return false}return true}catch(e){return true}};
var tol=Math.round(altoPag*0.16);var cortes=[0],y=0;while(y+altoPag+tol<cv.height){var c=y+altoPag,k=0;while(k<160&&!vacia(c-k))k++;if(k>=160)k=0;c=c-k;if(c<=y)c=y+altoPag;cortes.push(c);y=c}
for(var q=0;q<cortes.length;q++){if(i||q)doc.addPage();
var y0=cortes[q],y1=(q+1<cortes.length)?cortes[q+1]:cv.height,alto=Math.min(altoPag,y1-y0);
var tr=document.createElement('canvas');tr.width=cv.width;tr.height=altoPag;var c2=tr.getContext('2d');
c2.fillStyle='#FBF8F1';c2.fillRect(0,0,tr.width,tr.height);
c2.drawImage(cv,0,y0,cv.width,alto,0,0,cv.width,alto);
doc.addImage(tr.toDataURL('image/jpeg',0.92),'JPEG',0,0,210,297,undefined,'FAST')}
i++;return paso()})}
return paso()}).then(function(){if(b){b.textContent=ant;b.disabled=false}})
.catch(function(e){if(b){b.textContent=ant;b.disabled=false}alert('No he podido preparar el PDF: '+((e&&(e.message||e.name))||e))})}
var cv,ctx,pintando=false,hayFirma=false;
function prepararLienzo(){cv=document.getElementById('cv');var r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;
cv.width=r.width*d;cv.height=r.height*d;ctx=cv.getContext('2d');ctx.scale(d,d);ctx.lineWidth=2.2;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#1c1f22';
var pos=function(e){var b=cv.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:p.clientX-b.left,y:p.clientY-b.top}};
var ini=function(e){e.preventDefault();pintando=true;hayFirma=true;var p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};
var mov=function(e){if(!pintando)return;e.preventDefault();var p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()};
var fin=function(){pintando=false};
cv.addEventListener('mousedown',ini);cv.addEventListener('mousemove',mov);window.addEventListener('mouseup',fin);
cv.addEventListener('touchstart',ini,{passive:false});cv.addEventListener('touchmove',mov,{passive:false});cv.addEventListener('touchend',fin);}
function limpiar(){ctx.clearRect(0,0,cv.width,cv.height);hayFirma=false}
function enviar(){var msg=document.getElementById('msg');
if(!document.getElementById('nom').value.trim()){msg.textContent='Pon tu nombre.';return}
if(!hayFirma){msg.textContent='Firma con el dedo en el recuadro.';return}
if(!document.getElementById('acepto').checked){msg.textContent='Marca la casilla de aceptación bajo reserva.';msg.style.color='#b3261e';var ch=document.querySelector('.chk');ch.style.borderColor='#b3261e';ch.scrollIntoView({behavior:'smooth',block:'center'});return}
document.getElementById('btn').disabled=true;msg.textContent='Enviando…';
var f={firma:cv.toDataURL('image/png'),nombreFirma:document.getElementById('nom').value.trim(),dni:document.getElementById('dni').value.trim(),fechaFirma:new Date().toLocaleString('es-ES'),aceptado:true};
db.collection('firmas').doc(TOK).update(f).then(function(){f.aviso=DATOS.aviso;pintaFin(f)})
.catch(function(e){document.getElementById('btn').disabled=false;msg.textContent='No se ha podido enviar ('+e.message+')'});}
</script></body></html>
